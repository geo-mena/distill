<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>SelphID SDK — Kubernetes deployment</title>
  <desc>Mermaid TB flowchart translated to a Distill diagram. A client application reaches a Kong ingress / load balancer over HTTPS (TLS terminated at the edge), which forwards HTTP on port 8080 to a ClusterIP Service inside an active/active Kubernetes cluster of stateless selphid-sdk pods (REST API on 8080) spread across worker nodes with pod anti-affinity. A Secret (license.lic) is mounted into the pods, health probes hit GET /health on 8080, and only the 1:N gallery uses persistent storage. Pods make outbound HTTPS calls to FacePhi's online license service. Prometheus and Grafana provide recommended observability.</desc>
  <style>
    text {
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .eyebrow         { font-size: 11px; font-weight: 500; letter-spacing: 1.1px; fill: #6a6a6a; }
    .container-label { font-size: 11px; font-weight: 600; letter-spacing: 0.4px; fill: #6a6a6a; }
    .block           { font-size: 12px; font-weight: 500; fill: #2a2a2a; }
    .block-sm        { font-size: 11px; font-weight: 500; fill: #2a2a2a; }
    .block-sub       { font-size: 10px; fill: #6a6a6a; }
    .edge-label      { font-size: 10px; fill: #6a6a6a; font-style: italic; }
  </style>

  <defs>
    <!-- bespoke line-art service icons, drawn in #666 1.5px stroke -->
    <symbol id="service-app" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="1.5" fill="none" stroke="#666" stroke-width="1.5"/>
      <line x1="3" y1="8.5" x2="21" y2="8.5" stroke="#666" stroke-width="1.2"/>
      <circle cx="6" cy="6.2" r="0.7" fill="#666"/>
      <circle cx="8.5" cy="6.2" r="0.7" fill="#666"/>
      <line x1="7" y1="12.5" x2="17" y2="12.5" stroke="#666" stroke-width="1"/>
      <line x1="7" y1="15.5" x2="13" y2="15.5" stroke="#666" stroke-width="1"/>
    </symbol>
    <symbol id="service-license" viewBox="0 0 24 24">
      <rect x="4" y="3" width="16" height="12" rx="1" fill="none" stroke="#666" stroke-width="1.5"/>
      <line x1="7" y1="7" x2="17" y2="7" stroke="#666" stroke-width="1"/>
      <line x1="7" y1="10" x2="14" y2="10" stroke="#666" stroke-width="1"/>
      <circle cx="12" cy="17" r="2.8" fill="none" stroke="#666" stroke-width="1.3"/>
      <polyline points="10.3,19 9.8,22.5 12,21 14.2,22.5 13.7,19" fill="none" stroke="#666" stroke-width="1.2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="service-secret" viewBox="0 0 24 24">
      <rect x="5" y="10" width="14" height="10" rx="1.5" fill="none" stroke="#666" stroke-width="1.5"/>
      <path d="M8 10 V 7.5 C 8 5 10 3.5 12 3.5 C 14 3.5 16 5 16 7.5 V 10" fill="none" stroke="#666" stroke-width="1.5"/>
      <circle cx="12" cy="14" r="1.3" fill="none" stroke="#666" stroke-width="1.3"/>
      <line x1="12" y1="15.3" x2="12" y2="17.5" stroke="#666" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
    <symbol id="service-svc" viewBox="0 0 24 24">
      <rect x="9" y="9" width="6" height="6" rx="1" fill="none" stroke="#666" stroke-width="1.5"/>
      <circle cx="4" cy="5" r="1.6" fill="none" stroke="#666" stroke-width="1.2"/>
      <circle cx="20" cy="5" r="1.6" fill="none" stroke="#666" stroke-width="1.2"/>
      <circle cx="4" cy="19" r="1.6" fill="none" stroke="#666" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="1.6" fill="none" stroke="#666" stroke-width="1.2"/>
      <line x1="9" y1="9" x2="5.2" y2="6" stroke="#666" stroke-width="1.1"/>
      <line x1="15" y1="9" x2="18.8" y2="6" stroke="#666" stroke-width="1.1"/>
      <line x1="9" y1="15" x2="5.2" y2="18" stroke="#666" stroke-width="1.1"/>
      <line x1="15" y1="15" x2="18.8" y2="18" stroke="#666" stroke-width="1.1"/>
    </symbol>
    <!-- reused from _service-icons.svg (inline-copy for portability) -->
    <symbol id="service-load-balancer" viewBox="0 0 24 24">
      <line x1="6" y1="3" x2="6" y2="21" stroke="#666" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="6" x2="18" y2="6" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="6" y1="12" x2="18" y2="12" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="6" y1="18" x2="18" y2="18" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
      <polygon points="18,4 21,6 18,8" fill="#666"/>
      <polygon points="18,10 21,12 18,14" fill="#666"/>
      <polygon points="18,16 21,18 18,20" fill="#666"/>
    </symbol>
    <symbol id="service-health-check" viewBox="0 0 24 24">
      <polyline points="2,12 7,12 9.5,5 13.5,19 16,12 22,12" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="service-container" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="#666" stroke-width="1.5"/>
      <rect x="6" y="6" width="12" height="12" rx="0.8" fill="none" stroke="#666" stroke-width="1.2"/>
      <rect x="9" y="9" width="6" height="6" rx="0.5" fill="none" stroke="#666" stroke-width="1"/>
    </symbol>
    <symbol id="service-block-storage" viewBox="0 0 24 24">
      <ellipse cx="12" cy="6" rx="7" ry="2.2" fill="none" stroke="#666" stroke-width="1.5"/>
      <path d="M5 6 V 9 C 5 10.2 8 11.2 12 11.2 C 16 11.2 19 10.2 19 9 V 6" fill="none" stroke="#666" stroke-width="1.5"/>
      <ellipse cx="12" cy="12" rx="7" ry="2.2" fill="none" stroke="#666" stroke-width="1.5"/>
      <path d="M5 12 V 15 C 5 16.2 8 17.2 12 17.2 C 16 17.2 19 16.2 19 15 V 12" fill="none" stroke="#666" stroke-width="1.5"/>
      <ellipse cx="12" cy="18" rx="7" ry="2.2" fill="none" stroke="#666" stroke-width="1.5"/>
      <circle cx="12" cy="6" r="0.6" fill="#666"/>
      <circle cx="12" cy="12" r="0.6" fill="#666"/>
      <circle cx="12" cy="18" r="0.6" fill="#666"/>
    </symbol>
    <symbol id="service-dashboard" viewBox="0 0 24 24">
      <rect x="3" y="3" width="8.5" height="6" rx="0.5" fill="none" stroke="#666" stroke-width="1.2"/>
      <rect x="12.5" y="3" width="8.5" height="10" rx="0.5" fill="none" stroke="#666" stroke-width="1.2"/>
      <rect x="3" y="11" width="8.5" height="10" rx="0.5" fill="none" stroke="#666" stroke-width="1.2"/>
      <rect x="12.5" y="15" width="8.5" height="6" rx="0.5" fill="none" stroke="#666" stroke-width="1.2"/>
      <line x1="5" y1="13.5" x2="9.5" y2="13.5" stroke="#666" stroke-width="1"/>
      <line x1="5" y1="16.5" x2="9.5" y2="16.5" stroke="#666" stroke-width="1"/>
    </symbol>
  </defs>

  <rect width="1200" height="800" fill="#fdfdfd"/>

  <text x="50" y="32" class="eyebrow">SELPHID SDK — KUBERNETES DEPLOYMENT</text>

  <!-- ─── subgraph containers (background) ─── -->
  <!-- K8S cluster (dashed boundary) -->
  <rect x="50" y="330" width="800" height="440" rx="10" fill="#fafbfd" stroke="#9aa8c0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="64" y="350" class="container-label">CLÚSTER KUBERNETES — ACTIVO/ACTIVO, PODS STATELESS</text>
  <!-- EDGE -->
  <rect x="110" y="170" width="320" height="100" rx="8" fill="#fbfcfb" stroke="#cdd6cd" stroke-width="1"/>
  <text x="122" y="188" class="container-label">CAPA DE ACCESO</text>
  <!-- NODES -->
  <rect x="290" y="448" width="340" height="132" rx="8" fill="#fdfbf7" stroke="#e0cfa8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="302" y="466" class="container-label">NODOS WORKER — ANTIAFINIDAD DE PODS</text>
  <!-- OBS -->
  <rect x="900" y="620" width="250" height="120" rx="8" fill="#fdf8fa" stroke="#e6cdd8" stroke-width="1"/>
  <text x="912" y="638" class="container-label">OBSERVABILIDAD RECOMENDADA</text>

  <!-- ─── edges ─── -->
  <!-- Cliente → LB (HTTPS) -->
  <path d="M160 126 V158 H270 V196" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="266,196 274,196 270,200" fill="#666"/>
  <text x="176" y="150" class="edge-label">HTTPS</text>

  <!-- LB → SVC (HTTP 8080) -->
  <path d="M270 260 V357 H460 V364" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="456,364 464,364 460,368" fill="#666"/>
  <text x="284" y="312" class="edge-label">HTTP 8080</text>

  <!-- SVC → pods (fan) -->
  <path d="M460 416 V444" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="350" y1="444" x2="570" y2="444" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="350" y1="444" x2="350" y2="492" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="346,492 354,492 350,496" fill="#666"/>
  <line x1="460" y1="444" x2="460" y2="492" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="456,492 464,492 460,496" fill="#666"/>
  <line x1="570" y1="444" x2="570" y2="492" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="566,492 574,492 570,496" fill="#666"/>

  <!-- Sec ⇢ pods (montado) -->
  <line x1="225" y1="505" x2="286" y2="505" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3"/>
  <polygon points="286,501 290,505 286,509" fill="#666"/>
  <text x="256" y="499" class="edge-label" text-anchor="middle">montado</text>

  <!-- HC ⇢ pods (liveness y readiness) -->
  <line x1="225" y1="560" x2="286" y2="560" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3"/>
  <polygon points="286,556 290,560 286,564" fill="#666"/>
  <text x="256" y="551" class="edge-label" text-anchor="middle">liveness y</text>
  <text x="256" y="575" class="edge-label" text-anchor="middle">readiness</text>

  <!-- pods ⇢ PV (solo 1:N) -->
  <line x1="460" y1="580" x2="460" y2="638" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3"/>
  <polygon points="456,638 464,638 460,642" fill="#666"/>
  <text x="470" y="615" class="edge-label">solo 1:N</text>

  <!-- pods → Lic (HTTPS saliente) -->
  <line x1="630" y1="510" x2="926" y2="510" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="926,506 926,514 930,510" fill="#666"/>
  <text x="705" y="502" class="edge-label">HTTPS saliente</text>

  <!-- Mon ⇢ pods (monitorización recomendada) -->
  <path d="M920 693 H645 V565 H634" fill="none" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/>
  <polygon points="634,561 630,565 634,569" fill="#666"/>
  <text x="770" y="687" class="edge-label" text-anchor="middle">monitorización recomendada</text>

  <!-- ─── nodes ─── -->
  <!-- Cliente (ext / blue) -->
  <rect x="70" y="70" width="180" height="56" rx="4" fill="#d6e4f3" stroke="#356aa8" stroke-width="1.2"/>
  <use href="#service-app" x="80" y="87" width="22" height="22"/>
  <text x="178" y="98" class="block" text-anchor="middle" dominant-baseline="middle">Aplicación cliente</text>

  <!-- Lic (ext / blue) -->
  <rect x="930" y="470" width="220" height="80" rx="4" fill="#d6e4f3" stroke="#356aa8" stroke-width="1.2"/>
  <use href="#service-license" x="942" y="499" width="22" height="22"/>
  <text x="1054" y="503" class="block-sm" text-anchor="middle">Servicio de licencias</text>
  <text x="1054" y="520" class="block-sub" text-anchor="middle">online de FacePhi</text>

  <!-- LB (edge / green) -->
  <rect x="130" y="200" width="280" height="60" rx="4" fill="#dbe9d6" stroke="#5a8754" stroke-width="1.2"/>
  <use href="#service-load-balancer" x="140" y="219" width="22" height="22"/>
  <text x="285" y="224" class="block-sm" text-anchor="middle">Balanceador o Ingress Kong</text>
  <text x="285" y="241" class="block-sub" text-anchor="middle">HTTPS — TLS terminado aquí</text>

  <!-- SVC (edge / green) -->
  <rect x="320" y="368" width="280" height="48" rx="4" fill="#dbe9d6" stroke="#5a8754" stroke-width="1.2"/>
  <use href="#service-svc" x="330" y="381" width="22" height="22"/>
  <text x="462" y="392" class="block-sm" text-anchor="middle" dominant-baseline="middle">Service ClusterIP — 8080 TCP</text>

  <!-- Sec (data / purple) -->
  <rect x="70" y="452" width="155" height="58" rx="4" fill="#ddd9ee" stroke="#8a78c4" stroke-width="1.2"/>
  <use href="#service-secret" x="80" y="470" width="22" height="22"/>
  <text x="160" y="476" class="block-sm" text-anchor="middle">Secret</text>
  <text x="160" y="492" class="block-sub" text-anchor="middle">license.lic</text>

  <!-- HC (edge / green) -->
  <rect x="70" y="534" width="155" height="66" rx="4" fill="#dbe9d6" stroke="#5a8754" stroke-width="1.2"/>
  <use href="#service-health-check" x="80" y="554" width="22" height="22"/>
  <text x="160" y="560" class="block-sm" text-anchor="middle">Sondas de salud</text>
  <text x="160" y="576" class="block-sub" text-anchor="middle">GET /health en 8080</text>

  <!-- Pods (pod / cream) -->
  <rect x="302" y="496" width="96" height="72" rx="4" fill="#fbecd6" stroke="#a87439" stroke-width="1.2"/>
  <use href="#service-container" x="339" y="502" width="22" height="22"/>
  <text x="350" y="540" class="block-sub" text-anchor="middle" style="font-weight:500;fill:#2a2a2a">Pod selphid-sdk</text>
  <text x="350" y="555" class="block-sub" text-anchor="middle">API REST 8080</text>

  <rect x="412" y="496" width="96" height="72" rx="4" fill="#fbecd6" stroke="#a87439" stroke-width="1.2"/>
  <use href="#service-container" x="449" y="502" width="22" height="22"/>
  <text x="460" y="540" class="block-sub" text-anchor="middle" style="font-weight:500;fill:#2a2a2a">Pod selphid-sdk</text>
  <text x="460" y="555" class="block-sub" text-anchor="middle">API REST 8080</text>

  <rect x="522" y="496" width="96" height="72" rx="4" fill="#fbecd6" stroke="#a87439" stroke-width="1.2"/>
  <use href="#service-container" x="559" y="502" width="22" height="22"/>
  <text x="570" y="540" class="block-sub" text-anchor="middle" style="font-weight:500;fill:#2a2a2a">Pod selphid-sdk</text>
  <text x="570" y="555" class="block-sub" text-anchor="middle">API REST 8080</text>

  <!-- PV (data / purple) -->
  <rect x="320" y="642" width="280" height="64" rx="4" fill="#ddd9ee" stroke="#8a78c4" stroke-width="1.2"/>
  <use href="#service-block-storage" x="330" y="660" width="22" height="22"/>
  <text x="462" y="667" class="block-sm" text-anchor="middle">Almacenamiento persistente</text>
  <text x="462" y="684" class="block-sub" text-anchor="middle">Galería 1:N</text>

  <!-- Mon (obs / pink) -->
  <rect x="920" y="662" width="210" height="62" rx="4" fill="#f4dce6" stroke="#a8507a" stroke-width="1.2"/>
  <use href="#service-dashboard" x="930" y="682" width="22" height="22"/>
  <text x="1040" y="693" class="block-sm" text-anchor="middle" dominant-baseline="middle">Prometheus y Grafana</text>
</svg>
