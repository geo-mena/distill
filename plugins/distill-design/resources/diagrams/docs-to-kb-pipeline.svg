<svg viewBox="0 0 1500 220" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Docs-to-KB auto-sync pipeline</title>
  <desc>Mermaid LR flowchart translated to a Distill diagram. A developer commits a .md file to the docs.facephi GitHub repo. A push to main triggers a GitHub Action workflow that detects changed .md files and POSTs them to the Frontline KB API. The Frontline Vector DB re-chunks and re-embeds the documents, leaving the bot updated within seconds.</desc>
  <style>
    text {
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .eyebrow       { font-size: 11px; font-weight: 500; letter-spacing: 1.1px; fill: #6a6a6a; }
    .block         { font-size: 12px; font-weight: 500; fill: #2a2a2a; }
    .block-sub     { font-size: 10px; fill: #6a6a6a; }
    .diamond-label { font-size: 11px; font-weight: 500; fill: #2a2a2a; }
  </style>

  <defs>
    <!-- bespoke line-art service icons, drawn in #666 1.5px stroke -->
    <symbol id="service-developer" viewBox="0 0 24 24">
      <circle cx="9" cy="7.5" r="2.6" fill="none" stroke="#666" stroke-width="1.5"/>
      <path d="M3.5 18 C 3.5 14 6 13 9 13 C 12 13 14.5 14 14.5 18" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
      <polyline points="17,9 14.5,11.5 17,14" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="19,9 21.5,11.5 19,14" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="service-repo" viewBox="0 0 24 24">
      <path d="M3 7 V 19 H 21 V 9 H 12 L 10 7 Z" fill="none" stroke="#666" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="6" y1="13" x2="18" y2="13" stroke="#666" stroke-width="1"/>
      <line x1="6" y1="16" x2="14" y2="16" stroke="#666" stroke-width="1"/>
    </symbol>
    <symbol id="service-gh-action" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#666" stroke-width="1.5"/>
      <polygon points="10,8 17,12 10,16" fill="none" stroke="#666" stroke-width="1.4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="service-md-file" viewBox="0 0 24 24">
      <path d="M5 3 H 14 L 19 8 V 21 H 5 Z" fill="none" stroke="#666" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="14,3 14,8 19,8" fill="none" stroke="#666" stroke-width="1.2" stroke-linejoin="round"/>
      <line x1="8" y1="13" x2="16" y2="13" stroke="#666" stroke-width="1"/>
      <line x1="8" y1="16" x2="16" y2="16" stroke="#666" stroke-width="1"/>
      <line x1="8" y1="19" x2="13" y2="19" stroke="#666" stroke-width="1"/>
    </symbol>
    <symbol id="service-api-gateway" viewBox="0 0 24 24">
      <line x1="7" y1="4" x2="7" y2="20" stroke="#666" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="17" y1="4" x2="17" y2="20" stroke="#666" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="7" y1="4" x2="17" y2="4" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="2.5" y1="12" x2="20" y2="12" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
      <polygon points="20,10 22.5,12 20,14" fill="#666"/>
    </symbol>
    <symbol id="service-vector-db" viewBox="0 0 24 24">
      <ellipse cx="12" cy="6" rx="7" ry="2.5" fill="none" stroke="#666" stroke-width="1.5"/>
      <path d="M5 6 V 18 C 5 19.4 8 20.5 12 20.5 C 16 20.5 19 19.4 19 18 V 6" fill="none" stroke="#666" stroke-width="1.5"/>
      <circle cx="8.5" cy="12" r="0.7" fill="#666"/>
      <circle cx="12" cy="12" r="0.7" fill="#666"/>
      <circle cx="15.5" cy="12" r="0.7" fill="#666"/>
      <circle cx="8.5" cy="15" r="0.7" fill="#666"/>
      <circle cx="12" cy="15" r="0.7" fill="#666"/>
      <circle cx="15.5" cy="15" r="0.7" fill="#666"/>
      <circle cx="8.5" cy="18" r="0.7" fill="#666"/>
      <circle cx="12" cy="18" r="0.7" fill="#666"/>
      <circle cx="15.5" cy="18" r="0.7" fill="#666"/>
    </symbol>
    <symbol id="service-embed" viewBox="0 0 24 24">
      <rect x="3" y="5" width="6" height="14" rx="0.5" fill="none" stroke="#666" stroke-width="1.4"/>
      <line x1="4.5" y1="8.5" x2="7.5" y2="8.5" stroke="#666" stroke-width="0.9"/>
      <line x1="4.5" y1="11" x2="7.5" y2="11" stroke="#666" stroke-width="0.9"/>
      <line x1="4.5" y1="13.5" x2="7.5" y2="13.5" stroke="#666" stroke-width="0.9"/>
      <line x1="4.5" y1="16" x2="6.5" y2="16" stroke="#666" stroke-width="0.9"/>
      <line x1="10" y1="12" x2="14" y2="12" stroke="#666" stroke-width="1.3" stroke-linecap="round"/>
      <polygon points="13.5,10 15.5,12 13.5,14" fill="#666"/>
      <circle cx="17" cy="8" r="0.8" fill="#666"/>
      <circle cx="20" cy="8" r="0.8" fill="#666"/>
      <circle cx="17" cy="12" r="0.8" fill="#666"/>
      <circle cx="20" cy="12" r="0.8" fill="#666"/>
      <circle cx="17" cy="16" r="0.8" fill="#666"/>
      <circle cx="20" cy="16" r="0.8" fill="#666"/>
    </symbol>
    <symbol id="service-bot" viewBox="0 0 24 24">
      <rect x="4" y="8" width="16" height="12" rx="2" fill="none" stroke="#666" stroke-width="1.5"/>
      <line x1="12" y1="4.5" x2="12" y2="8" stroke="#666" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="12" cy="4" r="1" fill="none" stroke="#666" stroke-width="1.2"/>
      <circle cx="9" cy="13" r="1.2" fill="none" stroke="#666" stroke-width="1.3"/>
      <circle cx="15" cy="13" r="1.2" fill="none" stroke="#666" stroke-width="1.3"/>
      <line x1="10" y1="17" x2="14" y2="17" stroke="#666" stroke-width="1.2" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1500" height="220" fill="#fdfdfd"/>

  <text x="30" y="32" class="eyebrow">DOCS — KB AUTO-SYNC PIPELINE</text>

  <!-- A: Developer -->
  <rect x="30" y="100" width="130" height="70" rx="4" fill="#fdfdfd" stroke="#d8d8d4" stroke-width="1"/>
  <use href="#service-developer" x="38" y="112" width="22" height="22"/>
  <text x="106" y="130" class="block" text-anchor="middle">Developer</text>
  <text x="106" y="148" class="block-sub" text-anchor="middle">commits .md</text>

  <line x1="162" y1="135" x2="190" y2="135" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="190,131 194,135 190,139" fill="#666"/>

  <!-- B: GitHub Repo -->
  <rect x="194" y="100" width="130" height="70" rx="4" fill="#fdfdfd" stroke="#d8d8d4" stroke-width="1"/>
  <use href="#service-repo" x="202" y="112" width="22" height="22"/>
  <text x="270" y="130" class="block" text-anchor="middle">GitHub Repo</text>
  <text x="270" y="148" class="block-sub" text-anchor="middle">docs.facephi</text>

  <line x1="326" y1="135" x2="354" y2="135" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="354,131 358,135 354,139" fill="#666"/>

  <!-- C: Decision (diamond) — Push a main -->
  <polygon points="423,95 488,135 423,175 358,135" fill="#fdfdfd" stroke="#d8d8d4" stroke-width="1"/>
  <text x="423" y="139" class="diamond-label" text-anchor="middle">Push a main</text>

  <line x1="490" y1="135" x2="518" y2="135" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="518,131 522,135 518,139" fill="#666"/>

  <!-- D: GitHub Action (HIGHLIGHT blue) -->
  <rect x="522" y="100" width="130" height="70" rx="4" fill="#d6e4f3" stroke="#356aa8" stroke-width="1.2"/>
  <use href="#service-gh-action" x="530" y="112" width="22" height="22"/>
  <text x="598" y="130" class="block" text-anchor="middle">GitHub Action</text>
  <text x="598" y="148" class="block-sub" text-anchor="middle">workflow trigger</text>

  <line x1="654" y1="135" x2="682" y2="135" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="682,131 686,135 682,139" fill="#666"/>

  <!-- E: Detect changed .md files -->
  <rect x="686" y="100" width="130" height="70" rx="4" fill="#fdfdfd" stroke="#d8d8d4" stroke-width="1"/>
  <use href="#service-md-file" x="694" y="112" width="22" height="22"/>
  <text x="762" y="130" class="block" text-anchor="middle">Detect changed</text>
  <text x="762" y="148" class="block-sub" text-anchor="middle">.md files</text>

  <line x1="818" y1="135" x2="846" y2="135" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="846,131 850,135 846,139" fill="#666"/>

  <!-- F: POST API Frontline KB (HIGHLIGHT cream) -->
  <rect x="850" y="100" width="130" height="70" rx="4" fill="#fbecd6" stroke="#a87439" stroke-width="1.2"/>
  <use href="#service-api-gateway" x="858" y="112" width="22" height="22"/>
  <text x="926" y="130" class="block" text-anchor="middle">POST API</text>
  <text x="926" y="148" class="block-sub" text-anchor="middle">Frontline KB</text>

  <line x1="982" y1="135" x2="1010" y2="135" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="1010,131 1014,135 1010,139" fill="#666"/>

  <!-- G: Frontline Vector DB (stadium shape — distinguishes data store) -->
  <rect x="1014" y="100" width="130" height="70" rx="14" fill="#fdfdfd" stroke="#d8d8d4" stroke-width="1"/>
  <use href="#service-vector-db" x="1026" y="112" width="22" height="22"/>
  <text x="1094" y="130" class="block" text-anchor="middle">Frontline</text>
  <text x="1094" y="148" class="block-sub" text-anchor="middle">Vector DB</text>

  <line x1="1146" y1="135" x2="1174" y2="135" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="1174,131 1178,135 1174,139" fill="#666"/>

  <!-- H: Re-chunk + Re-embed -->
  <rect x="1178" y="100" width="130" height="70" rx="4" fill="#fdfdfd" stroke="#d8d8d4" stroke-width="1"/>
  <use href="#service-embed" x="1186" y="112" width="22" height="22"/>
  <text x="1254" y="130" class="block" text-anchor="middle">Re-chunk +</text>
  <text x="1254" y="148" class="block-sub" text-anchor="middle">Re-embed</text>

  <line x1="1310" y1="135" x2="1338" y2="135" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="1338,131 1342,135 1338,139" fill="#666"/>

  <!-- I: Bot actualizado (HIGHLIGHT green) -->
  <rect x="1342" y="100" width="130" height="70" rx="4" fill="#dbe9d6" stroke="#5a8754" stroke-width="1.2"/>
  <use href="#service-bot" x="1350" y="112" width="22" height="22"/>
  <text x="1418" y="130" class="block" text-anchor="middle">Bot actualizado</text>
  <text x="1418" y="148" class="block-sub" text-anchor="middle">en segundos</text>
</svg>
